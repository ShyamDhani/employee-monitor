version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: employee-monitor-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: employee-monitor-backend
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/employee_monitor?authSource=admin
      JWT_SECRET: your_jwt_secret_change_in_production
      JWT_EXPIRE: 7d
      GOOGLE_CLIENT_ID: your_google_client_id
      GOOGLE_CLIENT_SECRET: your_google_client_secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
      CLIENT_URL: http://localhost:5173
      NODE_ENV: production
    volumes:
      - screenshots_data:/app/uploads/screenshots
    restart: unless-stopped

  dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    container_name: employee-monitor-dashboard
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: employee-monitor-ngrok
    restart: unless-stopped
    depends_on:
      - backend
      - dashboard
    command: ["http", "dashboard:80", "--domain=${NGROK_DOMAIN:-employee-monitor.ngrok-free.app}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"

volumes:
  mongodb_data:
  screenshots_data:
